<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
  <title>Smart Exam 28 - Zenith Math</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* CSS GABUNGAN & REFINED UI */
    body { font-family: 'Poppins', sans-serif; margin: 0; background: #F8FAFC; text-align: center; overflow: hidden; user-select: none; }
    .header { height: 140px; background: linear-gradient(135deg, #FFD54F, #8B5CF6); border-bottom-left-radius: 40px; border-bottom-right-radius: 40px; }
    .card { background: white; width: 380px; max-width: 92%; margin: -60px auto 20px auto; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); box-sizing: border-box; transition: .3s; }
    input, select { width: 90%; padding: 14px; border-radius: 30px; border: 2px solid #8B5CF6; margin: 10px 0; font-size: 16px; text-align: center; outline: none; }
    button { background: linear-gradient(135deg, #6C63FF, #8B5CF6); color: white; padding: 12px 40px; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; margin-top: 10px; width: 100%; transition: .2s; }
    button:active { transform: scale(0.98); }

    /* UJIAN TOOLBAR & PAGE */
    #ujianPage { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: #f0f2f5; z-index: 999; display: flex; flex-direction: column; }
    .exam-header { background: white; padding: 10px 0; border-bottom: 1px solid #e0e0e0; display: flex; flex-direction: column; align-items: center; }
    .topbar-controls { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; padding: 5px 15px; box-sizing: border-box; }
    .toolbar { display: flex; gap: 6px; }
    .toolbar button { width: 40px; height: 36px; font-size: 16px; padding: 0; border-radius: 8px; background: #f1f5f9; color: black; border: 1px solid #d1d5db; margin: 0; }
    .exitBtn { background: #DC2626 !important; color: white !important; border: none !important; }
    .timer { font-size: 16px; color: #DC2626; font-weight: bold; background: #fee2e2; padding: 5px 15px; border-radius: 20px; }
    .iframe-container { flex: 1; margin: 8px; background: white; border-radius: 8px; border: 1px solid #d1d5db; overflow: hidden; position: relative; }
    iframe { width: 100%; height: 100%; border: none; transition: transform 0.2s; transform-origin: 0 0; }

    /* MODALS & LOCKSCREEN */
    .popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); z-index: 10000; }
    .popupCard { background: white; width: 320px; max-width: 85%; margin: 25vh auto; padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
    #lockScreen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.98); z-index: 20000; flex-direction: column; align-items: center; justify-content: center; color: white; }
    #splash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #8B5CF6; z-index: 30000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.5s; }
  </style>
</head>
<body>

  <div id="splash">
    <img src="https://drive.google.com/thumbnail?id=18TFLdzKVQoKqXUuIkD47kCE6MqJDHUiq&sz=w500" style="width:120px; margin-bottom:20px;">
    <h2 style="color:white;">Smart Exam</h2>
    <div style="width:40px; height:40px; border:4px solid #f3f3f3; border-top:4px solid #FFD54F; border-radius:50%; animation: spin 1s linear infinite;"></div>
  </div>

  <div class="header"></div>

  <!-- LANDING -->
  <div id="landing" class="card">
    <img src="https://drive.google.com/thumbnail?id=18TFLdzKVQoKqXUuIkD47kCE6MqJDHUiq&sz=w500" style="width:65px; margin-bottom:15px;">
    <h2>Smart Exam</h2>
    <p style="font-size:14px; color:#666; margin-top:-10px;">SMPN 28 Malang</p>
    <input id="namaSiswa" list="listNama" placeholder="Nama Lengkap" autocomplete="off">
    <datalist id="listNama"></datalist>
    <input id="token" placeholder="Masukkan TOKEN" oninput="this.value=this.value.toUpperCase()">
    <select id="kelas"><option value="">Memuat kelas...</option></select>
    <button id="btnCek" onclick="cekToken()">CEK UJIAN</button>
  </div>

  <!-- INFO -->
  <div id="examInfo" class="card" style="display:none">
    <h3>Informasi Ujian</h3>
    <p id="mapel"></p>
    <p id="jadwal"></p>
    <p id="durasi"></p>
    <button onclick="mulaiUjian()">MULAI UJIAN</button>
  </div>

  <!-- UJIAN PAGE -->
  <div id="ujianPage" style="display:none">
    <div class="exam-header">
      <div style="font-size: 11px; font-weight: 600; color: #64748b;">SMART EXAM 28</div>
      <div class="topbar-controls">
        <div class="toolbar">
          <button onclick="refreshForm()">🔄</button>
          <button onclick="zoomIn()">+</button>
          <button onclick="zoomOut()">−</button>
          <button onclick="exitUjian()" class="exitBtn">⏻</button>
        </div>
        <div class="timer" id="timer">00:00</div>
      </div>
    </div>
    <div class="iframe-container">
      <iframe id="formFrame"></iframe>
    </div>
  </div>

  <!-- LOCK SCREEN -->
  <div id="lockScreen">
    <h2 style="color:#FFD54F;">⚠️ PERINGATAN</h2>
    <p id="lockMsg">Anda keluar dari mode ujian!</p>
    <button onclick="kembaliKeUjian()" style="background:#FFD54F; color:black; width:auto; padding:15px 40px; border-radius:30px; font-weight:bold;">LANJUTKAN UJIAN</button>
  </div>

  <audio id="alarmAudio" src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" loop></audio>

  <script>
    <script>
    const BACKEND_URL = "https://script.google.com/macros/s/AKfycbyC-O4sRF355UTWdddYZTISl4A0f_nZpxT1K4CMYpHDJ4HwKyPrIkiVkDbc6hhFxhOlYA/exec"; 
    const APP = { 
        ujianAktif: false, warningCount: 0, maxWarning: 3, zoom: 1, 
        exitLimit: 10, alarm: document.getElementById("alarmAudio") 
    };

    async function callAPI(action, data = {}) {
        try {
            const res = await fetch(BACKEND_URL, { method: "POST", body: JSON.stringify({ action, data }) });
            return await res.json();
        } catch (e) {
            console.error("API Error:", e);
            return null;
        }
    }

    // PERBAIKAN URUTAN LOADING AGAR TIDAK NYANGKUT
    window.onload = async () => {
        // 1. Hilangkan splash screen dulu setelah 2 detik agar tidak nyangkut
        setTimeout(() => {
            const splash = document.getElementById('splash');
            splash.style.opacity = '0';
            setTimeout(() => splash.style.display = 'none', 500);
        }, 2000);

        // 2. Load data secara paralel di belakang layar
        try {
            const [kelas, siswa] = await Promise.all([
                callAPI('getKelasList'),
                callAPI('getAllNamaSiswa')
            ]);

            if (kelas) {
                document.getElementById("kelas").innerHTML = '<option value="">Pilih Kelas</option>' + 
                    kelas.map(k => `<option value="${k}">${k}</option>`).join('');
            }
            if (siswa) {
                document.getElementById("listNama").innerHTML = siswa.map(s => `<option value="${s}">`).join('');
            }
        } catch (e) {
            console.error("Gagal memuat data awal:", e);
        }
    };

   async function cekToken() {
      const btn = document.getElementById("btnCek");
      btn.innerText = "MENGECEK..."; btn.disabled = true;
      const res = await callAPI('getExamByToken', { token: document.getElementById("token").value, kelas: document.getElementById("kelas").value });
      if(res.status) {
        Object.assign(APP, res);
        APP.namaSiswa = document.getElementById("namaSiswa").value;
        const mhs = await callAPI('cariDataSiswa', { nama: APP.namaSiswa });
        APP.kelasSiswa = mhs.found ? mhs.kelas : document.getElementById("kelas").value;
        APP.ruangSiswa = mhs.found ? mhs.ruang : "Luar";
        document.getElementById("landing").style.display = "none";
        document.getElementById("examInfo").style.display = "block";
        document.getElementById("mapel").innerText = "Mapel: " + res.mapel;
        document.getElementById("jadwal").innerText = `Waktu: ${res.mulai} - ${res.selesai}`;
        document.getElementById("durasi").innerText = `Durasi: ${res.durasi} Menit (${APP.ruangSiswa})`;
      } else { alert(res.message); }
      btn.innerText = "CEK UJIAN"; btn.disabled = false;
    }

    function mulaiUjian() {
      APP.ujianAktif = true; APP.waktuMulai = Date.now();
      document.getElementById("examInfo").style.display = "none";
      document.getElementById("ujianPage").style.display = "flex";
      document.getElementById("formFrame").src = APP.linkForm + "?embedded=true";
      paksaFullscreen(); startTimer(); heartbeat("ON");
    }

    function startTimer() {
      setInterval(() => {
        const sisa = (APP.durasiUjian * 60000) - (Date.now() - APP.waktuMulai);
        if(sisa <= 0) location.reload();
        const m = Math.floor(sisa / 60000), s = Math.floor((sisa % 60000) / 1000);
        document.getElementById("timer").innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
      }, 1000);
    }

    function tanganiPelanggaran(jenis) {
      if(!APP.ujianAktif) return;
      APP.warningCount++; APP.alarm.play();
      document.getElementById("lockScreen").style.display = "flex";
      document.getElementById("lockMsg").innerText = `${jenis} (Peringatan ke-${APP.warningCount})`;
      callAPI('simpanLog', { nama: APP.namaSiswa, kelas: APP.kelasSiswa, ruang: APP.ruangSiswa, mapel: APP.mapelUjian, jenis: `${jenis} (${APP.warningCount})` });
      if(APP.warningCount >= APP.maxWarning) { alert("Batas pelanggaran tercapai!"); location.reload(); }
    }

    function paksaFullscreen() {
      const doc = document.documentElement;
      if (doc.requestFullscreen) doc.requestFullscreen();
      else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
      document.getElementById("lockScreen").style.display = "none";
    }

    function kembaliKeUjian() { APP.alarm.pause(); APP.alarm.currentTime = 0; paksaFullscreen(); }

    function heartbeat(st) { callAPI('heartbeat', { nama: APP.namaSiswa, mapel: APP.mapelUjian, status: st }); }

    setInterval(() => {
      if(APP.ujianAktif && !document.hidden) {
        const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
        if(!isIOS && !document.fullscreenElement) tanganiPelanggaran("Keluar Fullscreen");
        heartbeat("ON");
      }
    }, 15000);

    document.addEventListener("visibilitychange", () => {
      if(document.hidden && APP.ujianAktif) { tanganiPelanggaran("Pindah Tab"); heartbeat("AWAY"); }
    });

    function exitUjian() {
      const sisaMenit = (APP.durasiUjian * 60000 - (Date.now() - APP.waktuMulai)) / 60000;
      if(sisaMenit > APP.exitLimit) return alert(`Belum bisa keluar! Tunggu ${Math.ceil(sisaMenit - APP.exitLimit)} menit lagi.`);
      const token = prompt("Masukkan Token Keluar:");
      if(token === APP.exit) { heartbeat("OUT"); location.reload(); } else alert("Token Salah!");
    }

    function refreshForm() { document.getElementById("formFrame").src = APP.linkForm + "?embedded=true"; }
    function zoomIn() { if(APP.zoom < 1.5) { APP.zoom += 0.1; applyZoom(); } }
    function zoomOut() { if(APP.zoom > 0.7) { APP.zoom -= 0.1; applyZoom(); } }
    function applyZoom() { 
      const f = document.getElementById("formFrame");
      f.style.width = (100/APP.zoom)+"%"; f.style.height = (100/APP.zoom)+"%";
      f.style.transform = `scale(${APP.zoom})`; 
    }
  </script>
</body>
</html>
