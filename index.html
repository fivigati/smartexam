<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Exam - Zenith Math</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* CSS GABUNGAN */
        body { font-family: 'Poppins', sans-serif; margin: 0; background: #F8FAFC; text-align: center; overflow-x: hidden; }
        .header { height: 140px; background: linear-gradient(135deg, #FFD54F, #8B5CF6); border-bottom-left-radius: 40px; border-bottom-right-radius: 40px; }
        .card { background: white; width: 380px; max-width: 92%; margin: -60px auto 20px auto; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); box-sizing: border-box; }
        input, select { width: 90%; padding: 14px; border-radius: 30px; border: 2px solid #8B5CF6; margin: 10px 0; font-size: 16px; text-align: center; outline: none; }
        button { background: linear-gradient(135deg, #6C63FF, #8B5CF6); color: white; padding: 12px 40px; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; margin-top: 10px; transition: .2s; width: 100%; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        
        /* EXAM INTERFACE */
        #ujianPage { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: #f0f2f5; z-index: 999; display: flex; flex-direction: column; }
        .exam-header { background: white; padding: 10px 0; border-bottom: 1px solid #e0e0e0; display: flex; flex-direction: column; align-items: center; }
        .exam-logo-img { height: 35px; width: auto; margin-bottom: 5px; }
        .topbar-controls { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; padding: 5px 15px; box-sizing: border-box; }
        .timer { font-size: 16px; color: #DC2626; font-weight: bold; background: #fee2e2; padding: 5px 15px; border-radius: 20px; }
        .iframe-container { flex: 1; margin: 10px; background: white; border-radius: 8px; border: 1px solid #d1d5db; overflow: hidden; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        
        /* MODALS */
        .popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); z-index: 10000; }
        .popupCard { background: white; width: 320px; max-width: 85%; margin: 25vh auto; padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        #lockScreen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.98); z-index: 20000; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .error-text { color: #ff4757; font-size: 13px; margin-top: 5px; font-weight: 600; display: none; }
    </style>
</head>
<body>

    <div id="splash" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#8B5CF6; z-index:30000; display:flex; flex-direction:column; align-items:center; justify-content:center; transition: 0.5s;">
        <img src="https://drive.google.com/thumbnail?id=18TFLdzKVQoKqXUuIkD47kCE6MqJDHUiq&sz=w500" style="width:100px; margin-bottom:20px;">
        <h2 style="color:white;">Smart Exam</h2>
    </div>

    <div class="header"></div>

    <div id="landing" class="card">
        <img id="appLogo" src="https://drive.google.com/thumbnail?id=18TFLdzKVQoKqXUuIkD47kCE6MqJDHUiq&sz=w500" style="width:60px; margin-bottom:10px;">
        <h2 id="appName" style="margin: 5px 0;">Smart Exam</h2>
        <p id="schoolName" style="font-size:14px; color:#666;">SMPN 28 Malang</p>
        <input id="namaSiswa" list="listNama" placeholder="Nama Lengkap" autocomplete="off">
        <datalist id="listNama"></datalist>
        <input id="token" placeholder="TOKEN UJIAN" autocomplete="off">
        <select id="kelas"><option value="">Memuat kelas...</option></select>
        <button id="btnCek" onclick="cekToken()">CEK UJIAN</button>
    </div>

    <div id="examInfo" class="card" style="display:none">
        <h3>Informasi Ujian</h3>
        <p id="mapel"></p>
        <p id="jadwal"></p>
        <p id="durasi"></p>
        <button onclick="mulaiUjian()">MULAI UJIAN</button>
    </div>

    <div id="ujianPage" style="display:none">
        <div class="exam-header">
            <img src="https://drive.google.com/thumbnail?id=18TFLdzKVQoKqXUuIkD47kCE6MqJDHUiq&sz=w500" class="exam-logo-img">
            <div class="topbar-controls">
                <div class="timer" id="timer">00:00</div>
                <button onclick="exitUjian()" style="width:auto; padding:5px 15px; background:red; margin:0;">KELUAR</button>
            </div>
        </div>
        <div class="iframe-container">
            <iframe id="formFrame"></iframe>
        </div>
    </div>

    <div id="lockScreen">
        <h2>Layar Terkunci</h2>
        <p>Anda terdeteksi keluar dari mode ujian.</p>
        <button onclick="paksaFullscreen()" style="width:auto; background:#FFD54F; color:black;">KEMBALI KE UJIAN</button>
    </div>

    <div id="popupExit" class="popup">
        <div class="popupCard">
            <h3>Konfirmasi Keluar</h3>
            <input type="text" id="exitInput" placeholder="Token Keluar">
            <div id="errorExit" class="error-text">Token Salah!</div>
            <button onclick="konfirmasiExit()">KELUAR SEKARANG</button>
            <button onclick="batalExit()" style="background:#eee; color:#333;">BATAL</button>
        </div>
    </div>

    <script>
        // --- KONFIGURASI API ---
        const BACKEND_URL = "https://script.google.com/macros/s/AKfycbyC-O4sRF355UTWdddYZTISl4A0f_nZpxT1K4CMYpHDJ4HwKyPrIkiVkDbc6hhFxhOlYA/exec"; 

        const APP = {
            ujianAktif: false,
            linkForm: "",
            exitToken: "",
            durasiUjian: 0,
            waktuMulai: 0,
            namaSiswa: "",
            mapelUjian: "",
            kelasSiswa: "",
            ruangSiswa: "",
            warningCount: 0,
            heartbeatInterval: null
        };

        // --- API CALLER ---
        async function callAPI(action, data = {}) {
            const response = await fetch(BACKEND_URL, {
                method: "POST",
                body: JSON.stringify({ action, data })
            });
            return response.json();
        }

        // --- INITIAL LOAD ---
        window.onload = async () => {
            setTimeout(() => document.getElementById('splash').style.display = 'none', 2000);
            
            // Load Kelas & Siswa secara paralel
            try {
                const kelas = await callAPI('getKelasList');
                const siswa = await callAPI('getAllNamaSiswa');
                
                const sel = document.getElementById("kelas");
                sel.innerHTML = '<option value="">Pilih Kelas</option>';
                kelas.forEach(k => sel.innerHTML += `<option value="${k}">${k}</option>`);

                const dl = document.getElementById("listNama");
                siswa.forEach(s => dl.innerHTML += `<option value="${s}">`);
            } catch(e) { console.error("Gagal load data awal"); }
        };

        // --- CORE LOGIC ---
        async function cekToken() {
            const btn = document.getElementById("btnCek");
            const nama = document.getElementById("namaSiswa").value;
            const token = document.getElementById("token").value;
            const kelas = document.getElementById("kelas").value;

            if(!nama || !token || !kelas) return alert("Lengkapi data!");

            btn.disabled = true;
            btn.innerText = "Mengecek...";

            const res = await callAPI('getExamByToken', { token, kelas });
            if(res.status) {
                const mhs = await callAPI('cariDataSiswa', { nama });
                APP.namaSiswa = nama;
                APP.mapelUjian = res.mapel;
                APP.linkForm = res.link;
                APP.exitToken = res.exit;
                APP.durasiUjian = res.durasi;
                APP.kelasSiswa = mhs.found ? mhs.kelas : kelas;
                APP.ruangSiswa = mhs.found ? mhs.ruang : "Luar";

                document.getElementById("landing").style.display = "none";
                document.getElementById("examInfo").style.display = "block";
                document.getElementById("mapel").innerText = "Mapel: " + res.mapel;
                document.getElementById("jadwal").innerText = "Waktu: " + res.mulai + " - " + res.selesai;
                document.getElementById("durasi").innerText = "Durasi: " + res.durasi + " Menit";
            } else {
                alert(res.message);
            }
            btn.disabled = false;
            btn.innerText = "CEK UJIAN";
        }

        function mulaiUjian() {
            APP.ujianAktif = true;
            document.getElementById("examInfo").style.display = "none";
            document.getElementById("ujianPage").style.display = "flex";
            document.getElementById("formFrame").src = APP.linkForm + "?embedded=true";
            APP.waktuMulai = Date.now();
            
            mulaiHeartbeat();
            startTimer();
            paksaFullscreen();
        }

        // --- SECURITY ---
        function paksaFullscreen() {
            const doc = document.documentElement;
            if (doc.requestFullscreen) doc.requestFullscreen();
            else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
            
            document.getElementById("lockScreen").style.display = "none";
        }

        document.addEventListener("visibilitychange", () => {
            if(document.hidden && APP.ujianAktif) {
                document.getElementById("lockScreen").style.display = "flex";
                callAPI('simpanLog', { 
                    nama: APP.namaSiswa, kelas: APP.kelasSiswa, ruang: APP.ruangSiswa, 
                    mapel: APP.mapelUjian, jenis: "Pindah Tab" 
                });
                callAPI('heartbeat', { nama: APP.namaSiswa, mapel: APP.mapelUjian, status: "AWAY" });
            } else if (!document.hidden && APP.ujianAktif) {
                callAPI('heartbeat', { nama: APP.namaSiswa, mapel: APP.mapelUjian, status: "ON" });
            }
        });

        // --- HEARTBEAT ---
        function mulaiHeartbeat() {
            callAPI('heartbeat', { nama: APP.namaSiswa, mapel: APP.mapelUjian, status: "ON" });
            APP.heartbeatInterval = setInterval(() => {
                if(APP.ujianAktif) {
                    const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
                    const st = (document.hidden || (!isIOS && !document.fullscreenElement)) ? "AWAY" : "ON";
                    callAPI('heartbeat', { nama: APP.namaSiswa, mapel: APP.mapelUjian, status: st });
                }
            }, 15000);
        }

        // --- TIMER ---
        function startTimer() {
            setInterval(() => {
                const sisa = (APP.durasiUjian * 60000) - (Date.now() - APP.waktuMulai);
                if(sisa <= 0) location.reload();
                const m = Math.floor(sisa / 60000);
                const s = Math.floor((sisa % 60000) / 1000);
                document.getElementById("timer").innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            }, 1000);
        }

        // --- EXIT ---
        function exitUjian() {
            document.getElementById("popupExit").style.display = "block";
        }
        function konfirmasiExit() {
            if(document.getElementById("exitInput").value === APP.exitToken) {
                callAPI('heartbeat', { nama: APP.namaSiswa, mapel: APP.mapelUjian, status: "OUT" });
                location.reload();
            } else {
                document.getElementById("errorExit").style.display = "block";
            }
        }
        function batalExit() { document.getElementById("popupExit").style.display = "none"; }
    </script>
</body>
</html>
